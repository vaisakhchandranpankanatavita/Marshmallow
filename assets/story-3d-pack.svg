      <circle cx="12" cy="-1" r="5.5" fill="#141414"/><circle cx="12" cy="-3" r="1.8" fill="white"/>
      <path d="M-7 10 Q0 16 7 10" stroke="#141414" stroke-width="2.4" fill="none" stroke-linecap="round"/>
