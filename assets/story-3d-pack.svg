    <line x1="52" y1="110" x2="180" y2="110" stroke="#141414" stroke-width="3" stroke-linecap="round"/>
    <line x1="52" y1="128" x2="196" y2="128" stroke="#141414" stroke-width="3" stroke-linecap="round"/>
    <line x1="52" y1="146" x2="160" y2="146" stroke="#141414" stroke-width="3" stroke-linecap="round" opacity=".4"/>
