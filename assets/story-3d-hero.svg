<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img">
<!-- ultra-premium poster card — marshmallow hero -->
<rect width="800" height="600" rx="28" fill="#FBF3E4"/>
<!-- textured dots -->
<g opacity=".08" fill="#141414">
  <circle cx="72" cy="72" r="3"/><circle cx="728" cy="88" r="2.5"/><circle cx="88" cy="528" r="2.5"/><circle cx="720" cy="522" r="3"/>
  <circle cx="400" cy="56" r="2"/><circle cx="120" cy="320" r="1.8"/><circle cx="680" cy="360" r="1.8"/>
</g>
